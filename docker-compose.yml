version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgis/postgis:15-3.3
    container_name: traffic-ai-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-traffic_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traffic_pass}
      POSTGRES_DB: ${POSTGRES_DB:-traffic_ai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/seed:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-traffic_user} -d ${POSTGRES_DB:-traffic_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - traffic-ai

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: traffic-ai-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - traffic-ai

  # Apache Kafka
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: traffic-ai-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 30s
      retries: 5
    networks:
      - traffic-ai

  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: traffic-ai-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    healthcheck:
      test: ["CMD","true"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - traffic-ai

  # MediaMTX - RTSP Media Gateway
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: traffic-ai-mediamtx
    ports:
      - "8554:8554"
      - "8889:8889"
    volumes:
      - ./media/mediamtx:/media
    networks:
      - traffic-ai

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: traffic-ai-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-traffic_user}:${POSTGRES_PASSWORD:-traffic_pass}@postgres:5432/${POSTGRES_DB:-traffic_ai}
      FASTAPI_ENV: ${FASTAPI_ENV:-development}
      FASTAPI_DEBUG: ${FASTAPI_DEBUG:-true}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      KAFKA_BROKER_URL: kafka:9092
      REDIS_URL: redis://redis:6379
      MEDIA_GATEWAY_URL: http://mediamtx:8889
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - ./media:/media
    networks:
      - traffic-ai
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # React Frontend (Optional - for development)
  # In production, serve frontend through Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: traffic-ai-frontend
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
    networks:
      - traffic-ai

  # Nginx Reverse Proxy (for production-like setup)
  nginx:
    image: nginx:alpine
    container_name: traffic-ai-nginx
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    networks:
      - traffic-ai

networks:
  traffic-ai:
    driver: bridge

volumes:
  postgres_data:
