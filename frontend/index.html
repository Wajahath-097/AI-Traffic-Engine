<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Traffic AI Engine</title>
    <script>
      window.addEventListener('error', function(e) {
        document.body.innerHTML += '<div style="color:red; z-index:9999; position:absolute; top:0; left:0; background:white; padding:20px; border:2px solid red; max-width: 100vw; overflow: auto;"><h2>Frontend Crash Detected:</h2>' + e.message + '<br>' + e.filename + ':' + e.lineno + '<br><pre>' + (e.error && e.error.stack ? e.error.stack : '') + '</pre></div>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        document.body.innerHTML += '<div style="color:red; z-index:9999; position:absolute; top:0; left:0; background:white; padding:20px; border:2px solid red; max-width: 100vw; overflow: auto;"><h2>Unhandled Promise Rejection:</h2>' + (e.reason && e.reason.message ? e.reason.message : e.reason) + '<br><pre>' + (e.reason && e.reason.stack ? e.reason.stack : '') + '</pre></div>';
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
